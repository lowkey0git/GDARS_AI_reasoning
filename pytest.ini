[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: tests that take > 5s (deselect with -m "not slow")
    integration: tests that require live API keys
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
