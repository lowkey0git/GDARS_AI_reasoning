version: "3.9"

# ============================================================
# GDARS v2 — Docker Compose
#
# Services:
#   redis  — working memory (Layer 1)
#   api    — FastAPI application
#
# To run:
#   docker compose up --build
#
# To run in background:
#   docker compose up -d --build
#
# To view logs:
#   docker compose logs -f api
# ============================================================

services:

  # ── Redis — working memory ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gdars-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # ── GDARS API ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gdars-api:latest
    container_name: gdars-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Redis URL to use the Docker service name
      MEMORY_REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    volumes:
      - gdars_data:/app/data
      - gdars_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

volumes:
  redis_data:
    driver: local
  gdars_data:
    driver: local
  gdars_logs:
    driver: local
